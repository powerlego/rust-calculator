[package]
name = "rust-calculator"
version = "2.0.0"
edition = "2021"
authors = ["Nicholas Curl"]
description = "A simple calculator written in Rust using JavaScript and WebAssembly"
readme = "README.md"
repository = "https://github.com/powerlego/rust-calculator"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wasm-bindgen = "0.2.92"


[lib]
name = "api"
crate-type = ["cdylib","rlib"]
path = "api/lib.rs"
